<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Vertical Pillar Gradient: Electric Cyan to Azure -->
    <linearGradient id="kd-stem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Upper Dynamic Wing Gradient: Azure to Bright Cyan -->
    <linearGradient id="kd-wing-up" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <!-- Lower Checkmark Vector Gradient: Azure to Electric Violet -->
    <linearGradient id="kd-wing-down" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="kd-ambient-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#00f2fe" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#kd-ambient-glow)">
    <!-- Vertical Pillar -->
    <rect x="8" y="6" width="12" height="52" rx="6" fill="url(#kd-stem-grad)" />

    <!-- Upper Velocity Wing -->
    <path d="M 26 31 L 47 10 C 49 8 53 9.5 53 12.5 L 53 17.5 C 53 19.5 52 21 50.5 22 L 35 32 Z" 
          fill="url(#kd-wing-up)" />

    <!-- Lower Quality Checkmark Vector -->
    <path d="M 26 33 L 50.5 54 C 52 55 53 56.5 53 58.5 L 53 61.5 C 53 64.5 49 66 47 64 L 23 43 C 21.5 41.5 21.5 39.5 23 38 Z" 
          fill="url(#kd-wing-down)" />
  </g>
</svg>
