<div class="auth-container">
  <div class="auth-box glass-card">
    <div class="brand-header">
      <div class="brand-logo">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <h2>Reset Password</h2>
      <p class="subtitle">Enter your registered email to receive a password reset link</p>
    </div>

    <div *ngIf="errorMessage" class="error-alert">
      <mat-icon>error_outline</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="error-alert" style="background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); color: #6ee7b7;">
      <mat-icon>check_circle</mat-icon>
      <span>{{ successMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Registered Email Address</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email" required placeholder="admin@qa-platform.com" />
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="loading" class="auth-btn" style="margin-top: 1rem;">
        <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
        <span *ngIf="!loading">Send Reset Request</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Remember your password?</span>
      <a routerLink="/login" class="link-highlight">Back to Sign In</a>
    </div>
  </div>
</div>
