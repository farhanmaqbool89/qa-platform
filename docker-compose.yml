services:
  postgres:
    image: postgres:16-alpine
    container_name: krodux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qadev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-qaplatform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qadev} -d ${POSTGRES_DB:-qaplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krodux-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./qa-backend
      dockerfile: Dockerfile
    container_name: krodux-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-qadev}:${POSTGRES_PASSWORD:-SuperSecurePass2026!}@postgres:5432/${POSTGRES_DB:-qaplatform}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-qa-platform-jwt-token-key-2026!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-qa-platform-refresh-token-key-2026!}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - backend_artifacts:/app/artifacts
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:3000:3000"

volumes:
  postgres_data:
  redis_data:
  backend_artifacts:
  backend_data:
